[project]
name = "aiops-platform"
version = "0.1.0"
description = "Human-governed AIOps simulation platform (Groq + FastAPI + SQLite/PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
    "psycopg2-binary>=2.9.9",
]

[tool.uv]
package = false
